<!doctype html>
<meta charset="utf-8">
<title>bossbot</title>
<!--
  Boss fight bots (docs/reviews/2026-10-06-playtest.md #7): the game runs in the frame with ?manual&fixed; a scripted bot presses keys
  each frame and the page title shows the result. Run it headless:
    Chrome --headless=new --virtual-time-budget=900000 --dump-dom "http://localhost:8779/tests/bossbot.html?boss=pier&diff=1&bot=varied"
  boss: street (Malaspina) | pier (Marchetti) | metro (Switch) | casino (Brask, hall and salon) | aquarium (Kalt) | hospital (Krieg,
  theatre and roof) | palmhouse (Vane) | train (Lenz) | spire (Bell, all rooms); minis: haak? no; tinder | cooler | teague | porter | brandt |
  grau | lys. The level bosses get the same varied bot (no level-specific reads: trains, fire and floors are left to chance).
  retries=N: after a Wasted card (not Wicked) the bot retries from the checkpoint up to N times (tries= counts them). diff: 0 Easy .. 3 Wicked. bot: jab (taps Q at the boss, nothing else) | varied (reads
  the tells: perfect dodges (Space just before the blow), steps back out of reach, jumps the sweep, the charge and the quakes, dodges
  through the hook and mashes free of it, hits a lobbed tuna back, punishes the recoveries with varied strings; grabs a stumbling crewman
  (walk into him: ←/→ + Q throw, or W knee) and takes the finisher (Q) on a beaten one; clears the fog at the lever).
  No block and no parry exist. seed: the game's seed. max: seconds of fight before it gives up.
  Result: <title>BOSSBOT ... result=win|lost|timeout t=<fight s> bossHp=<left> heroHp kos phases=<s each phase began></title>
-->
<style>body { margin: 0; background: #111; color: #ccc; font: 12px monospace; } iframe { border: 0; display: block; }</style>
<iframe id="g" width="960" height="540"></iframe>
<pre id="log"></pre>
<script>
const Q = new URLSearchParams(location.search), BOSS = Q.get('boss') || 'pier', DIFF = +(Q.get('diff') ?? 1), BOT = Q.get('bot') || 'jab';
const SEED = Q.get('seed') || '1', MAX = +(Q.get('max') || 360);
const fr = document.getElementById('g'), logEl = document.getElementById('log');
fr.src = `../index.html?manual&fixed&seed=${SEED}&v=${Date.now()}` + (Q.has('view3d') ? '&view3d' : '');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const log = s => { logEl.textContent += s + '\n'; };

fr.onload = async () => {
  const W = fr.contentWindow;
  for (let i = 0; i < 2000 && !W.__sim; i++) await sleep(50);   // (a busy machine loads slowly)
  const S = W.__sim;
  let keep0 = new Map(); try { keep0 = new Map(Object.keys(W.localStorage).map(k => [k, W.localStorage.getItem(k)])); } catch (e) {}
  // ---- keys ----
  const held = new Set(), ups = [];
  const kd = c => { if (held.has(c)) return; held.add(c); W.dispatchEvent(new W.KeyboardEvent('keydown', { code: c, key: c, bubbles: true })); };
  const ku = c => { if (!held.has(c)) return; held.delete(c); W.dispatchEvent(new W.KeyboardEvent('keyup', { code: c, key: c, bubbles: true })); };
  const tap = (c, n = 2) => { if (c === 'Space') ev.tapDodge = (ev.tapDodge || 0) + 1; ku(c); kd(c); ups.push([c, n]); };
  const releaseAll = () => { for (const c of [...held]) ku(c); ups.length = 0; };
  const walk = d => { if (d > 0) { ku('ArrowLeft'); kd('ArrowRight'); } else if (d < 0) { ku('ArrowRight'); kd('ArrowLeft'); } else { ku('ArrowLeft'); ku('ArrowRight'); } };
  // ---- start ----
  S.setDiff(DIFF);
  const LVS = { metro: ['__metro', 'toBoss'], tinder: ['__metro', 'toTinder'], casino: ['__casino', 'toHall'], cooler: ['__casino', 'toCooler'], aquarium: ['__aquarium', 'toBoss'],
    teague: ['__aquarium', 'toTeague'], hospital: ['__hospital', 'toBoss'], porter: ['__hospital', 'skip', 'porter'], palmhouse: ['__palmhouse', 'toBoss'], brandt: ['__palmhouse', 'skip', 'brandt'],
    train: ['__train', 'toBoss'], grau: ['__train', 'skip', 'dome'], spire: ['__spire', 'toBoss'], lys: ['__spire', 'skip', 'lys'] };
  const MINI = ['tinder', 'cooler', 'teague', 'porter', 'brandt', 'grau', 'lys'].includes(BOSS), LVK = LVS[BOSS], H = LVK ? W[LVK[0]] : null;
  const HK = { __metro: 'MR', __casino: 'CR', __aquarium: 'AR', __hospital: 'HR', __palmhouse: 'PR', __train: 'TR', __spire: 'SR' };
  const lvMod = () => H && (H[HK[LVK[0]]] || (H.ENG && null));
  let seen = null;   // the fighter the fight is about (the boss, or the mini-boss)
  const target = () => {
    if (!H) return S.enc.boss;
    const B = S.enc.boss;
    if (!MINI && B && !B.dead && !B.hold) return B;
    const M = lvMod(), m = M && M.mini ? M.mini() : null;
    if (MINI) return m;
    return B && !B.dead ? B : m;   // (a level boss between rooms: whatever is up)
  };
  if (H) { H[LVK[1]](LVK[2]); }
  else if (BOSS === 'pier') W.__pier9.toBoss(); else { W.__skipToBoss(); if (!Q.has('gun')) S.hero.weapon = 0; }   // (the street skip hands him the machine gun: the bots fight with fists unless &gun)
  S.setDiff(DIFF);
  let f = 0, f0 = -1, plan = [], lastAtk = -99, lastDef = -99;
  const phases = [], ev = { pdodge: 0, hookfree: 0, tunaback: 0, counter: 0, fogclear: 0, grabslip: 0, grab: 0, finisher: 0, hurt: 0 };
  S.bus.on('boss:phase', p => phases.push(((f - f0) / 60).toFixed(1)));
  S.bus.on('feat', k => { k = typeof k === 'object' ? k && k.name : k; if (k in ev) ev[k]++; });
  const why = [];   // ?dbg: what hit the hero (the boss's act or special, the distance, the hero's act)
  S.bus.on('hurt', p => { ev.hurt++; const B = S.enc.boss; if (B) why.push(`${((f - f0) / 60).toFixed(1)}:${B.act || B.sp || (S.quakes.length ? 'quake' : S.p9.tuna.st === 'swing' ? 'tuna' : 'goon?')}/${Math.round(Math.abs(B.x - S.ctl.x))}/${S.hero.act}/${p.dmg}`); });
  const step = () => { for (let i = ups.length - 1; i >= 0; i--) if (--ups[i][1] <= 0) { ku(ups[i][0]); ups.splice(i, 1); } W.__step(1); f++; };

  // ---- the bots ----
  const E = S.EMOVES;
  function tc(B) {   // time to contact of the boss's strike (s), or null
    if (B.act && !B.struck) { const M = E[B.act]; if (M && M.win && M.win[0] < 9) return (M.win[0] - B.actT) / (B.ph === 1 ? 0.85 : 1); }
    if (B.sp && B.spT < 0) return -B.spT + (B.sp === 'grab' ? 0.05 : B.sp === 'tuna' ? 0.06 : 0);
    return null;
  }
  function jab(B) {
    const c = S.ctl, dx = B.x - c.x, adx = Math.abs(dx), d = Math.sign(dx) || 1;
    if (adx > 18 + 4 * B.s) { walk(d); return; }
    walk(0);
    if (c.face !== d) { tap(d > 0 ? 'ArrowRight' : 'ArrowLeft', 1); return; }
    if (f % 9 === 0) tap('KeyQ', 2);
  }
  // a decent player: reads the tells, defends on time (with a little error), punishes the openings with varied strings
  let rng = 12345; const rnd = () => (rng = (rng * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  function varied(B) {
    const c = S.ctl, h = S.hero, dx = B.x - c.x, adx = Math.abs(dx), d = Math.sign(dx) || 1, away = d > 0 ? 'ArrowLeft' : 'ArrowRight', toward = d > 0 ? 'ArrowRight' : 'ArrowLeft';
    const busy = plan.length > 0;
    if (S.hookPull) { if (f % 3 === 0) tap(f % 6 ? 'KeyQ' : 'Space', 1); return; }   // mash free
    if (h.mode !== 'anim') { plan = []; return; }
    // the lobbed tuna: hit it back
    for (const b of S.eshots) if (b.k === 't' && !b.back) { const bd = (b.x - c.x) * c.face; if (bd > -2 && bd < 26 && Math.abs(b.y - (c.y - 14)) < 22 && f - lastAtk > 10) { if (c.face !== Math.sign(b.x - c.x)) tap(b.x > c.x ? 'ArrowRight' : 'ArrowLeft', 1); else { tap('KeyQ', 2); lastAtk = f; } return; } }
    // shockwaves and the conveyor's tuna
    for (const q of S.quakes) if (!q.hit && (c.x - q.x) * q.dir > 0 && (c.x - q.x) * q.dir < 24 && !c.air) { plan = []; tap('ArrowUp', 6); return; }
    const T = S.p9.tuna; if (T.st === 'swing' && Math.abs(T.x - c.x) < 60 && (c.x - T.x) * T.dir > -10) { plan = []; walk(0); kd('ArrowDown'); return; } else ku('ArrowDown');
    // defence
    const t = tc(B), near = adx < (B.reach || 25) + 30;
    if (t != null && f - lastDef > 12) {
      const jit = (rnd() - 0.5) * 0.06;
      if (B.sp === 'sweep' && t < 0.13 + jit && near) { plan = []; tap('ArrowUp', 8); lastDef = f; return; }   // the low sweep: jump it
      if (B.sp === 'hook') { const arr = t + Math.max(0, adx - 20) / 330; if (arr < 0.09 + jit) { plan = []; walk(0); tap('Space', 2); lastDef = f; } return; }   // dodge through the hook
      if (B.sp === 'charge') { const arr = t + Math.max(0, adx - 12) / (B.chgV || 215); if (arr < 0.09 + jit) { plan = []; if (rnd() < 0.5) tap('ArrowUp', 8); else tap('Space', 2); lastDef = f; } else if (!busy) walk(0); return; }   // jump or dodge the charge
      if (B.sp === 'grab' && near) { if (t < 0.09 + jit) { plan = []; walk(0); tap('Space', 2); lastDef = f; } else { plan = []; walk(-d); } return; }   // his hands open: back off, or dodge through it late
      if (B.sp === 'jslam') { walk(Math.sign(c.x - (B.jx ?? B.x)) || -d); return; }
      if (B.sp === 'lever' || B.sp === 'roar') { /* his back is turned (or he roars): fall through to offence */ }
      else if (near && (B.sp || B.act)) {   // a blow, the grab, the shove, the tuna swing: a perfect dodge (Space just before it lands), or a step back out of reach
        if (t < 0.09 + jit) { plan = []; walk(0); if (B.act === 'slam' || rnd() < 0.8) tap('Space', 2); else { walk(-d); plan.push({ at: f + 14, go: () => walk(0) }); } lastDef = f; } else if (!busy) walk(0);
        return;
      }
    }
    if (busy) { const [fn] = plan; if (fn.at <= f) { plan.shift(); fn.go(); } return; }
    // the fog: go throw the freezer lever back up
    if (B.hidden && S.p9.fog.on) { const lx = 2748 - 10; if (Math.abs(c.x - lx) > 3) { walk(Math.sign(lx - c.x)); return; } walk(0); if (c.face < 0) { tap('ArrowRight', 1); return; } tap('KeyQ', 2); lastAtk = f; return; }
    // the clinch: throw him (←/→ + Q, away from the boss), or a knee (W)
    if (c.grab) { if (f - lastAtk > 10) { if (c.grab.n >= 1 || rnd() < 0.5) { tap(d > 0 ? 'ArrowLeft' : 'ArrowRight', 4); tap('KeyQ', 2); } else tap('KeyW', 2); lastAtk = f; } return; }
    // a beaten crewman: the finisher (Q)
    if (S.finE && Math.abs(S.finE.x - c.x) < 26) { const fd = Math.sign(S.finE.x - c.x) || 1; if (c.face !== fd) { tap(fd > 0 ? 'ArrowRight' : 'ArrowLeft', 1); return; } if (f - lastAtk > 6) { tap('KeyQ', 2); lastAtk = f; } return; }
    // goons close by come first; one who stumbles: walk into him (the grab)
    const g = S.enemies.find(e => !e.dead && !e.down && e !== B && Math.abs(e.x - c.x) < 30 && Math.abs(e.y - c.y) < 14);
    if (g && !g.clinch && (g.exposed > 0 || (g.hurtT > 0 && !g.hurtLight)) && !S.hero.weapon) { walk(Math.sign(g.x - c.x) || 1); return; }
    const open = B.recT > 0 || B.exposed > 0 || B.stunT > 0 || B.sp === 'lever' || (B.sp === 'hook' && B.hook && B.hook.st === 'back');
    const tgt = g && (!open || adx > 50) ? g : B, tdx = tgt.x - c.x, tad = Math.abs(tdx), td = Math.sign(tdx) || 1, reach = tgt === B ? 18 + 4 * (B.s || 1) : 18;
    if (tad > reach) { walk(td); return; }
    walk(0);
    if (c.face !== td) { tap(td > 0 ? 'ArrowRight' : 'ArrowLeft', 1); return; }
    if (tgt === B && !open) {   // neutral: a quick poke when he is idle, else hold the spacing
      if (!B.act && !B.sp && f - lastAtk > (H ? 20 : 36)) strike(rnd() < 0.5 ? ['lp', 'lk'] : ['lk', 'lp']);
      return;
    }
    // a long opening (a big recovery, exposed, stunned, his back turned, or a crewman): a string with a heavy; a short one: two quick hits
    const long = tgt !== B || B.recT > 0.7 || B.exposed > 0.5 || B.stunT > 0.6 || B.sp === 'lever' || (B.sp === 'hook' && B.hook && B.hook.st === 'back');
    if (f - lastAtk > 8) strike(long ? (rnd() < 0.5 ? ['lp', 'lk', 'hp'] : ['lk', 'lp', 'hk']) : rnd() < 0.5 ? ['lp', 'lk'] : ['lk', 'lp']);
  }
  function strike(seq) {   // a string: each blow 14 frames apart; a heavy is a held key
    let at = f;
    for (const a of seq) {
      const k = a[1] === 'p' ? 'KeyQ' : 'KeyW', heavy = a[0] === 'h';
      plan.push({ at, go: () => tap(k, heavy ? 16 : 2) });
      at += heavy ? 26 : 14;
    }
    lastAtk = at;
  }

  // ---- run ----
  let result = 'timeout', tries = 0, lost = 0, hp0 = S.hero.hp, deadF = -1, wastF = -1, waitF = 0, fT = 0;
  const RETRIES = +(Q.get('retries') || 0);
  for (;;) {
    if (S.sceneOn) { W.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', bubbles: true })); await sleep(700); continue; }
    const B = target();
    if (f0 >= 0) { if (S.hero.hp < hp0) lost += hp0 - S.hero.hp; hp0 = S.hero.hp; }
    if (H && f0 >= 0) {   // a level boss: won when the ending runs, or the fighter is down and nobody takes its place
      if (B && !B.dead) { seen = B; deadF = -1; }
      else if (seen && seen.dead) { if (deadF < 0) deadF = f; }
      let endPh = null; try { endPh = W.__metro.peek().endPh; } catch (e) {}
      if (endPh || (deadF >= 0 && f - deadF > (MINI ? 30 : 600))) { result = 'win'; break; }
      if (S.flags.wasted) {
        if (wastF < 0) wastF = f;
        if (S.diffSel >= 3 || tries >= RETRIES) { result = 'lost'; break; }
        if (f - wastF > 120) { tries++; wastF = -1; seen = null; deadF = -1; releaseAll(); plan = []; S.retry(); hp0 = S.hero.hp; }
        step(); continue;
      }
      if (B && !B.intro && !B.hold && (S.enc.introT == null || S.enc.introT < 0)) varied(B); else if (!B && !S.sceneOn) { walk(1); if (f % 40 === 0) tap('ArrowUp', 20); } else releaseAll();   // (no one up: on to the next room, up a stair or a ladder)
      step();
      if ((f - f0) / 60 > MAX) break;
      if (f % 600 === 0) await sleep(0);
      continue;
    }
    if (H && f0 < 0) { if (B && !B.dead && !B.intro && !B.hold) { f0 = f; hp0 = S.hero.hp; log('start f=' + f); } else if (f > 60 * 90) { result = 'nostart'; break; } else { if (!B) walk(1); step(); if (f % 600 === 0) await sleep(0); continue; } }
    if (f0 < 0) { if (B && !B.intro && S.enc.introT < 0) { f0 = f; if (BOSS === 'street' && !Q.has('gun')) { S.hero.weapon = 0; for (const k of S.pickups) k.taken = true; } log('start f=' + f + ' w=' + S.hero.weapon); } }
    if (S.flags.wasted) {
      if (wastF < 0) wastF = f;
      if (S.diffSel >= 3 || tries >= RETRIES) { result = 'lost'; break; }
      if (f - wastF > 120) { tries++; wastF = -1; releaseAll(); plan = []; fT += f - f0; S.retry(); f0 = -1; waitF = f; }
      step(); continue;
    }
    if (B && B.dead) { result = 'win'; break; }
    if (f0 >= 0 && B) { if (BOT === 'jab') jab(B); else varied(B); }
    step();
    if (f0 >= 0 && (f - f0) / 60 > MAX) break;
    if (f0 < 0 && f - waitF > 60 * 40) { result = 'nostart'; break; }
    if (f % 600 === 0) await sleep(0);
  }
  releaseAll();
  const B = seen || target() || S.enc.boss, t = ((fT + f - f0) / 60).toFixed(1);   // (every try's fight time)
  const out = `BOSSBOT boss=${BOSS} diff=${DIFF} bot=${BOT} seed=${SEED} result=${result} t=${t} bossHp=${B ? Math.max(0, Math.round(B.hp)) : '-'}/${B ? B.maxHp : '-'} heroHp=${Math.round(S.hero.hp)} kos=${S.kos} tries=${tries} lost=${Math.round(lost)} phases=${phases.join(',')} ` + Object.entries(ev).map(([k, v]) => `${k}=${v}`).join(' ') + (Q.has('dbg') ? ' why=' + why.join(' ') : '');
  document.title = out; log(out);
  try { for (const k of Object.keys(W.localStorage)) if (!keep0.has(k)) W.localStorage.removeItem(k); else W.localStorage.setItem(k, keep0.get(k)); } catch (e) {}   // (put the storage back as it was: a win unlocks a chapter)
};
</script>
